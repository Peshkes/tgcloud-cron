# Generated by tgcloud-cron. Edit tgcron.json and run `npx tgcron generate github`.
# Schedules are UTC. GitHub may start scheduled runs late under load.
name: tgcron

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        required: true
        type: choice
        options:
          - "backup"

permissions:
  contents: read

concurrency:
  group: tgcron-${{ github.event.schedule || inputs.job == 'backup' && '30 2 * * *' || inputs.job }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run scheduled jobs
        if: github.event_name == 'schedule'
        run: npx --yes tgcloud-cron@0.1.0 tick --schedule "$SCHEDULE"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
      - name: Run job on demand
        if: github.event_name == 'workflow_dispatch'
        run: npx --yes tgcloud-cron@0.1.0 run "$JOB"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          JOB: ${{ inputs.job }}
      - name: Upload backup backup
        if: always() && hashFiles('tgcron-backup/backup/*/manifest.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: backup-${{ github.run_id }}
          path: tgcron-backup/backup/
          retention-days: 14
          if-no-files-found: ignore
