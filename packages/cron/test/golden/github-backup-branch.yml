# Generated by tgcloud-cron. Edit tgcron.json and run `npx tgcron generate github`.
# Schedules are UTC. GitHub may start scheduled runs late under load.
name: tgcron

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        required: true
        type: choice
        options:
          - "backup"

permissions:
  contents: write

concurrency:
  group: tgcron-${{ github.event.schedule || inputs.job == 'backup' && '30 2 * * *' || inputs.job }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run scheduled jobs
        if: github.event_name == 'schedule'
        run: npx --yes tgcloud-cron@0.1.0 tick --schedule "$SCHEDULE"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
      - name: Run job on demand
        if: github.event_name == 'workflow_dispatch'
        run: npx --yes tgcloud-cron@0.1.0 run "$JOB"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          JOB: ${{ inputs.job }}
      - name: Commit backups to tgcron-backups
        if: always() && (hashFiles('tgcron-backup/backup/*/manifest.json') != '')
        run: |
          set -euo pipefail
          branch='tgcron-backups'
          dir='.tgcron-branch-0'
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git worktree remove --force "$dir" 2>/dev/null || true
          git worktree add --detach "$dir"
          for attempt in 1 2 3; do
            if git -C "$dir" fetch --depth=1 origin "refs/heads/$branch"; then
              git -C "$dir" checkout -q -f --detach FETCH_HEAD
            else
              git -C "$dir" checkout -q -f --orphan "tgcron-new-$attempt"
              git -C "$dir" rm -rfq --ignore-unmatch .
            fi
            for job in backup; do
              for run in tgcron-backup/"$job"/*/; do
                [ -f "$run/manifest.json" ] || continue
                mkdir -p "$dir/$job"
                cp -R "${run%/}" "$dir/$job/"
              done
            done
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
            git -C "$dir" commit -qm "Backup $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C "$dir" push origin "HEAD:refs/heads/$branch"; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Could not push to $branch after 3 attempts." >&2
          exit 1
