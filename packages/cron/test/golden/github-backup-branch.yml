# Generated by tgcloud-cron. Edit tgcron.json and run `npx tgcron generate github`.
# Schedules are UTC. GitHub may start scheduled runs late under load.
name: tgcron

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        required: true
        type: choice
        options:
          - backup

permissions:
  contents: write

concurrency:
  group: tgcron-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run scheduled jobs
        if: github.event_name == 'schedule'
        run: npx --yes tgcloud-cron@0.1.0 tick --schedule "$SCHEDULE"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
      - name: Run job on demand
        if: github.event_name == 'workflow_dispatch'
        run: npx --yes tgcloud-cron@0.1.0 run "$JOB"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          JOB: ${{ inputs.job }}
      - name: Commit backup backup to tgcron-backups
        if: always() && hashFiles('tgcron-backup/backup/**') != ''
        run: |
          set -euo pipefail
          branch='tgcron-backups'
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898299+github-actions[bot]@users.noreply.github.com'
          if git fetch --depth=1 origin "$branch"; then
            git worktree add -B "$branch" .tgcron-branch FETCH_HEAD
          else
            git worktree add --detach .tgcron-branch
            git -C .tgcron-branch checkout --orphan "$branch"
            git -C .tgcron-branch rm -rfq .
          fi
          mkdir -p .tgcron-branch/backup
          cp -R tgcron-backup/backup/. .tgcron-branch/backup/
          git -C .tgcron-branch add backup
          git -C .tgcron-branch commit -qm "Backup backup $(date -u +%Y-%m-%dT%H:%MZ)"
          git -C .tgcron-branch push origin "$branch"
