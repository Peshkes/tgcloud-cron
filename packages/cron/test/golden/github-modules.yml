# Generated by tgcloud-cron. Edit tgcron.json and run `npx tgcron generate github`.
# Schedules are UTC. GitHub may start scheduled runs late under load.
name: tgcron

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "*/15 * * * *"
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now
        required: true
        type: choice
        options:
          - "dailyDigest"
          - "syncPrices"
          - "weeklyReport"
          - "weekdays"

permissions:
  contents: read

concurrency:
  group: tgcron-${{ github.event.schedule || inputs.job == 'dailyDigest' && '0 9 * * *' || inputs.job == 'syncPrices' && '*/15 * * * *' || inputs.job == 'weeklyReport' && '0 9 * * *' || inputs.job == 'weekdays' && '0 8 * * 1-5' || inputs.job }}
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run scheduled jobs
        if: github.event_name == 'schedule'
        run: npx --yes tgcloud-cron@0.1.0 tick --schedule "$SCHEDULE"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
      - name: Run job on demand
        if: github.event_name == 'workflow_dispatch'
        run: npx --yes tgcloud-cron@0.1.0 run "$JOB"
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
          JOB: ${{ inputs.job }}
